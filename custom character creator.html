<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishnamel's Custom Character Maker</title>
    <link rel="icon" href="emblem_placeholder.png" type="image/png">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #3b2f28;
            color: #e0d5c1;
            font-family: 'Bookman Old Style', serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Navigation Bar */
        .top-nav {
            background-color: #2b211a;
            border-bottom: 2px solid #6d5c4b;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            height: 60px;
            box-sizing: border-box;
            z-index: 10;
        }

        .top-nav h1 {
            margin: 0;
            font-size: 20px;
            font-family: 'Old English Text MT', serif;
            color: #d8c7a7;
            text-shadow: 2px 2px 4px #000;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            background-color: #5a4c42;
            color: #e0d5c1;
            border: 2px solid #6d5c4b;
            padding: 6px 12px;
            font-size: 13px;
            font-family: 'Bookman Old Style', serif;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #7a665b;
            border-color: #9d8872;
        }

        .btn-sm {
            padding: 2px 6px;
            font-size: 11px;
            margin-left: 4px;
        }

        .btn-primary { background-color: #15803d; }
        .btn-primary:hover { background-color: #16a34a; }
        .btn-blue { background-color: #1d4ed8; }
        .btn-blue:hover { background-color: #2563eb; }
        .btn-purple { background-color: #7c3aed; }
        .btn-purple:hover { background-color: #8b5cf6; }

        /* Main 2-Panel Layout */
        .maker-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        /* Left Form Area (Scrollable) */
        .form-panel {
            width: 52%;
            padding: 15px 20px;
            overflow-y: auto;
            box-sizing: border-box;
            background-color: #3b2f28;
            border-right: 2px solid #6d5c4b;
            height: 100%;
        }

        /* Right Preview Area (Locked / Non-Scrolling) */
        .preview-panel {
            width: 48%;
            padding: 15px;
            box-sizing: border-box;
            background-color: #4a3d34;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            overflow: hidden;
            position: sticky;
            top: 0;
        }

        /* Form Sections */
        .form-section {
            background-color: #4a3d34;
            border: 2px solid #6d5c4b;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #6d5c4b;
            padding-bottom: 4px;
            margin-bottom: 10px;
        }

        .section-header h3 {
            margin: 0;
            color: #d8c7a7;
            font-family: 'Old English Text MT', serif;
            font-size: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 12px;
            margin-bottom: 3px;
            color: #e0d5c1;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="text"], input[type="number"], select {
            background-color: #2b211a;
            color: #e0d5c1;
            border: 1px solid #6d5c4b;
            padding: 6px;
            font-size: 12px;
            border-radius: 4px;
            font-family: 'Bookman Old Style', serif;
            box-sizing: border-box;
            width: 100%;
        }

        input[type="range"] {
            accent-color: #9d8872;
            cursor: pointer;
        }

        .stat-input-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-badge {
            background-color: #2b211a;
            color: #ffd166;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #6d5c4b;
            font-weight: bold;
            font-size: 11px;
            min-width: 18px;
            text-align: center;
        }

        /* Live Preview Status Sheet (Non-Scrolling, Compact) */
        .status-card {
            width: 100%;
            background-color: #3b2f28;
            border: 2px solid #6d5c4b;
            border-radius: 8px;
            padding: 12px 15px;
            box-shadow: inset 2px 2px 6px #2b211a;
            font-size: 11.5px;
            line-height: 1.25;
            white-space: pre-wrap;
            font-family: 'Bookman Old Style', serif;
            box-sizing: border-box;
            text-align: left;
            flex: 1;
            overflow: hidden; /* Fits without scrolling */
        }

        .preview-emblem {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 3px solid #ffd166;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 8px;
            object-fit: cover;
        }

        .action-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .fit-option {
            background-color: #1e3a8a !important;
            color: #ffd166 !important;
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 950px) {
            body { overflow: auto; height: auto; }
            .maker-container { flex-direction: column; height: auto; }
            .form-panel, .preview-panel { width: 100%; height: auto; position: static; }
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <div class="top-nav">
        <h1>Ishnamel's Custom Character Studio</h1>
        <div class="nav-buttons">
            <button class="btn btn-purple" onclick="randomizeAll()">🎲 Randomize All</button>
            <button class="btn" onclick="window.location.href='index.html'">Generator</button>
            <button class="btn" onclick="window.location.href='battle_simulator.html'">Battle Sim</button>
            <button class="btn" onclick="window.location.href='moving_characters.html'">Arena Royale</button>
        </div>
    </div>

    <!-- Main Studio Layout -->
    <div class="maker-container">
        
        <!-- Form Panel (Left - Scrollable) -->
        <div class="form-panel">

                    <h3>Quick Presets</h3>

                <div style="display:flex; gap:6px; flex-wrap:wrap;">

                    <button class="btn" onclick="applyPreset('assassin')">🗡️ Speed Assassin</button>
                    <button class="btn" onclick="applyPreset('mage')">🔮 Archmage</button>
                    <button class="btn" onclick="applyPreset('archer')">🏹 Deadeye Archer</button>
                </div>
            </div>

            <!-- Basic Identity -->
            <div class="form-section">
                <div class="section-header">
                    <h3>Character Identity</h3>
                    <button class="btn btn-sm" onclick="randomizeSection('identity')">🎲 Section</button>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>First Name: <button class="btn btn-sm" onclick="randomizeDetail('firstName')">🎲</button></label>
                        <input type="text" id="firstName" value="Arthur" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>Last Name: <button class="btn btn-sm" onclick="randomizeDetail('lastName')">🎲</button></label>
                        <input type="text" id="lastName" value="Pendelton" oninput="updatePreview()">
                    </div>
                </div>
                <div class="form-grid" style="margin-top:8px;">
                    <div class="form-group">
                        <label>Race: <button class="btn btn-sm" onclick="randomizeDetail('race')">🎲</button></label>
                        <select id="raceSelect" onchange="onRaceChange()"></select>
                    </div>
                    <div class="form-group">
                        <label>Race Trait: <button class="btn btn-sm" onclick="randomizeDetail('trait')">🎲</button></label>
                        <select id="raceTraitsSelect" onchange="updatePreview()"></select>
                    </div>
                </div>
            </div>

            <!-- Attributes -->
            <div class="form-section">
                <div class="section-header">
                    <h3>Attributes & Potential</h3>
                    <button class="btn btn-sm" onclick="randomizeSection('attributes')">🎲 Section</button>
                </div>
                <p style="font-size:11px; margin-top:-4px; margin-bottom:8px; color:#d8c7a7;">Total Potential: <strong id="potentialText">60 (E)</strong></p>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Strength: <button class="btn btn-sm" onclick="randomizeDetail('str')">🎲</button></label>
                        <div class="stat-input-row">
                            <input type="number" id="strInput" value="10" min="1" max="30" oninput="onStatChange()">
                            <span class="stat-badge" id="strRating">E</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Constitution: <button class="btn btn-sm" onclick="randomizeDetail('con')">🎲</button></label>
                        <div class="stat-input-row">
                            <input type="number" id="conInput" value="10" min="1" max="30" oninput="onStatChange()">
                            <span class="stat-badge" id="conRating">E</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Dexterity: <button class="btn btn-sm" onclick="randomizeDetail('dex')">🎲</button></label>
                        <div class="stat-input-row">
                            <input type="number" id="dexInput" value="10" min="1" max="30" oninput="onStatChange()">
                            <span class="stat-badge" id="dexRating">E</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Intelligence: <button class="btn btn-sm" onclick="randomizeDetail('int')">🎲</button></label>
                        <div class="stat-input-row">
                            <input type="number" id="intInput" value="10" min="1" max="30" oninput="onStatChange()">
                            <span class="stat-badge" id="intRating">E</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Resolve: <button class="btn btn-sm" onclick="randomizeDetail('res')">🎲</button></label>
                        <div class="stat-input-row">
                            <input type="number" id="resInput" value="10" min="1" max="30" oninput="onStatChange()">
                            <span class="stat-badge" id="resRating">E</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Perception: <button class="btn btn-sm" onclick="randomizeDetail('per')">🎲</button></label>
                        <div class="stat-input-row">
                            <input type="number" id="perInput" value="10" min="1" max="30" oninput="onStatChange()">
                            <span class="stat-badge" id="perRating">E</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Appearance & Physical Characteristics -->
            <div class="form-section">
                <div class="section-header">
                    <h3>Physical Traits</h3>
                    <button class="btn btn-sm" onclick="randomizeSection('physical')">🎲 Section</button>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Blood Type: <button class="btn btn-sm" onclick="randomizeDetail('bloodType')">🎲</button></label>
                        <select id="bloodType" onchange="updatePreview()">
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="AB">AB</option>
                            <option value="O">O</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Skin Color: <button class="btn btn-sm" onclick="randomizeDetail('skin')">🎲</button></label>
                        <input type="text" id="skinColor" value="Fair" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>Left Eye: <button class="btn btn-sm" onclick="randomizeDetail('leftEye')">🎲</button></label>
                        <input type="text" id="leftEye" value="Brown" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>Right Eye: <button class="btn btn-sm" onclick="randomizeDetail('rightEye')">🎲</button></label>
                        <input type="text" id="rightEye" value="Brown" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>Hair Color: <button class="btn btn-sm" onclick="randomizeDetail('hairColor')">🎲</button></label>
                        <input type="text" id="hairColor" value="Black" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>Hair Style: <button class="btn btn-sm" onclick="randomizeDetail('hairStyle')">🎲</button></label>
                        <input type="text" id="hairStyle" value="Short" oninput="updatePreview()">
                    </div>
                </div>

                <div class="form-grid" style="margin-top:8px;">
                    <div class="form-group">
                        <label>Height (Ft/In): <button class="btn btn-sm" onclick="randomizeDetail('height')">🎲</button></label>
                        <div style="display:flex; gap:4px;">
                            <input type="number" id="heightFeet" value="5" min="1" max="9" oninput="calculateBMI()">
                            <input type="number" id="heightInches" value="10" min="0" max="11" oninput="calculateBMI()">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Weight (kg): <button class="btn btn-sm" onclick="randomizeDetail('weight')">🎲</button></label>
                        <input type="number" id="weightKg" value="75" min="20" max="300" oninput="calculateBMI()">
                    </div>
                </div>
                <div class="form-grid" style="margin-top:8px;">
                    <div class="form-group">
                        <label>BMI Category:</label>
                        <input type="text" id="bmiCategory" value="Normal weight" readonly>
                    </div>
                    <div class="form-group">
                        <label>Body Build: <button class="btn btn-sm" onclick="randomizeDetail('build')">🎲</button></label>
                        <select id="bodyBuildSelect" onchange="updatePreview()"></select>
                    </div>
                </div>
            </div>

            <!-- Combat & Equipment -->
            <div class="form-section">
                <div class="section-header">
                    <h3>Combat & Equipment</h3>
                    <button class="btn btn-sm" onclick="randomizeSection('combat')">🎲 Section</button>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Combat Class: <button class="btn btn-sm" onclick="randomizeDetail('class')">🎲</button></label>
                        <select id="combatClassSelect" onchange="onClassChange()"></select>
                    </div>
                    <div class="form-group">
                        <label>Combat Style: <button class="btn btn-sm" onclick="randomizeDetail('style')">🎲</button></label>
                        <select id="combatStyleSelect" onchange="updatePreview()">
                            <option value="Melee">Melee</option>
                            <option value="Ranged">Ranged</option>
                            <option value="Magic">Magic</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" style="margin-top:8px;">
                    <label>Combat Technique: <button class="btn btn-sm" onclick="randomizeDetail('technique')">🎲</button></label>
                    <select id="techniqueSelect" onchange="updatePreview()"></select>
                </div>
                <div class="form-grid" style="margin-top:8px;">
                    <div class="form-group">
                        <label>Main Hand: <button class="btn btn-sm" onclick="randomizeDetail('mainHand')">🎲</button></label>
                        <input type="text" id="mainHandInput" value="Steel Sword" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>Offhand: <button class="btn btn-sm" onclick="randomizeDetail('offHand')">🎲</button></label>
                        <input type="text" id="offHandInput" value="Iron Shield" oninput="updatePreview()">
                    </div>
                </div>
            </div>

            <!-- Condition & Environment -->
            <div class="form-section">
                <div class="section-header">
                    <h3>Conditions & Environment</h3>
                    <button class="btn btn-sm" onclick="randomizeSection('environment')">🎲 Section</button>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Pain: <button class="btn btn-sm" onclick="randomizeDetail('pain')">🎲</button></label>
                        <select id="painSelect" onchange="updatePreview()">
                            <option value="0">0</option>
                            <option value="Light">Light</option>
                            <option value="Moderate">Moderate</option>
                            <option value="Severe">Severe</option>
                            <option value="Intense">Intense</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Thirst: <button class="btn btn-sm" onclick="randomizeDetail('thirst')">🎲</button></label>
                        <select id="thirstSelect" onchange="updatePreview()">
                            <option value="Hydrated">Hydrated</option>
                            <option value="Mild">Mild</option>
                            <option value="Very thirsty">Very thirsty</option>
                            <option value="Dehydrated">Dehydrated</option>
                            <option value="Parched">Parched</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Rest: <button class="btn btn-sm" onclick="randomizeDetail('rest')">🎲</button></label>
                        <select id="restSelect" onchange="updatePreview()">
                            <option value="Awake">Awake</option>
                            <option value="Rested">Rested</option>
                            <option value="Sleepy">Sleepy</option>
                            <option value="Fatigued">Fatigued</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Hunger: <button class="btn btn-sm" onclick="randomizeDetail('hunger')">🎲</button></label>
                        <select id="hungerSelect" onchange="updatePreview()">
                            <option value="Satiated">Satiated</option>
                            <option value="Full">Full</option>
                            <option value="Hungry">Hungry</option>
                            <option value="Starving">Starving</option>
                        </select>
                    </div>
                </div>
                <div class="form-grid" style="margin-top:8px;">
                    <div class="form-group">
                        <label>Place: <button class="btn btn-sm" onclick="randomizeDetail('place')">🎲</button></label>
                        <input type="text" id="placeInput" value="Ironhold Keep" oninput="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>Weather: <button class="btn btn-sm" onclick="randomizeDetail('weather')">🎲</button></label>
                        <select id="weatherSelect" onchange="updatePreview()">
                            <option value="Clear">Clear</option>
                            <option value="Rainy">Rainy</option>
                            <option value="Foggy">Foggy</option>
                            <option value="Windy">Windy</option>
                            <option value="Stormy">Stormy</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Pixel Art Emblem Studio Controls -->
            <div class="form-section">
                <div class="section-header">
                    <h3>Pixel Art Emblem Settings</h3>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Pixel Width: <span id="pWidthVal">20</span></label>
                        <input type="range" id="pWidthSlider" min="10" max="30" value="20" oninput="updateEmblem()">
                    </div>
                    <div class="form-group">
                        <label>Pixel Height: <span id="pHeightVal">20</span></label>
                        <input type="range" id="pHeightSlider" min="10" max="30" value="20" oninput="updateEmblem()">
                    </div>
                    <div class="form-group">
                        <label>Pixel Size: <span id="pSizeVal">15</span></label>
                        <input type="range" id="pSizeSlider" min="5" max="30" value="15" oninput="updateEmblem()">
                    </div>
                    <div class="form-group">
                        <label>Colors: <span id="pColorVal">4</span></label>
                        <input type="range" id="pColorSlider" min="2" max="8" value="4" oninput="updateEmblem()">
                    </div>
                </div>
                <button class="btn" style="width:100%; margin-top:8px;" onclick="randomizeEmblemSeed()">🎲 Regenerate Emblem Art</button>
            </div>

        </div>

        <!-- Preview Panel (Right - Sticky & Locked) -->
        <div class="preview-panel">
            <div class="action-bar">
                <button class="btn btn-primary" onclick="saveCharacterToDB()">💾 Save to Database</button>
                <button class="btn btn-blue" onclick="exportPDF()">📄 Download PDF</button>
                <button class="btn" onclick="exportJSON()">📥 Export JSON</button>
                <button class="btn" onclick="triggerImportJSON()">📤 Import JSON</button>
                <input type="file" id="jsonFileInput" accept=".json" style="display:none;" onchange="importJSON(event)">
            </div>

            <img id="emblemPreviewImg" class="preview-emblem" src="" alt="Emblem">
            <div id="statusSheetPreview" class="status-card"></div>
        </div>

    </div>

    <!-- External Perlin / PDF Scripts -->
    <script src="perlin.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

// --- Stat Ratings ---
function getStatRating(val) {
    if (val >= 22) return "S";
    if (val >= 20) return "A";
    if (val >= 18) return "B";
    if (val >= 16) return "C";
    if (val >= 14) return "D";
    if (val >= 10) return "E";
    return "F";
}

function getPotentialRating(total) {
    if (total >= 200) return "EX";
    if (total >= 180) return "SSS";
    if (total >= 150) return "SS";
    if (total >= 120) return "S";
    if (total >= 100) return "A";
    if (total >= 80) return "B";
    if (total >= 75) return "C";
    if (total >= 70) return "D";
    if (total >= 65) return "E";
    return "F";
}

function calculateBMI() {
    const feet = parseInt(document.getElementById('heightFeet').value) || 5;
    const inches = parseInt(document.getElementById('heightInches').value) || 0;
    const weight = parseFloat(document.getElementById('weightKg').value) || 60;

    const heightM = (feet * 0.3048) + (inches * 0.0254);
    const bmi = weight / (heightM * heightM);

    let cat = "Normal weight";
    if (bmi < 18.5) cat = "Underweight";
    else if (bmi < 24.9) cat = "Normal weight";
    else if (bmi < 29.9) cat = "Overweight";
    else cat = "Obese";

    document.getElementById('bmiCategory').value = `${cat} (BMI: ${bmi.toFixed(1)})`;

    const builds = bodyBuildMap[cat] || ["Average"];
    const buildSelect = document.getElementById('bodyBuildSelect');
    const currentVal = buildSelect.value;
    buildSelect.innerHTML = '';
    builds.forEach(b => buildSelect.innerHTML += `<option value="${b}">${b}</option>`);
    if (builds.includes(currentVal)) buildSelect.value = currentVal;

    updatePreview();
}

// --- Pixel Art Generator ---
function seededRandom(s) {
    let x = Math.sin(s) * 10000;
    return x - Math.floor(x);
}

function generateSymmetricalPixelArt(seed, w, h, size, colorCount) {
    const canvas = document.createElement("canvas");
    canvas.width = w * size;
    canvas.height = h * size;
    const ctx = canvas.getContext("2d");

    const colors = [];
    for (let i = 0; i < colorCount; i++) {
        const val = seededRandom(seed + i + 1);
        const hue = Math.floor(val * 360);
        colors.push(`hsl(${hue}, 70%, 55%)`);
    }
    colors.push("black");

    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            if (x === 0 || y === 0 || x === w - 1 || y === h - 1) {
                ctx.fillStyle = "black";
                ctx.fillRect(x * size, y * size, size, size);
                ctx.fillRect((w - x - 1) * size, y * size, size, size);
                continue;
            }
            const sr = seededRandom(seed + y * w + x);
            const colIndex = Math.floor(sr * colors.length);
            ctx.fillStyle = colors[colIndex];
            ctx.fillRect(x * size, y * size, size, size);
            ctx.fillRect((w - x - 1) * size, y * size, size, size);
        }
    }
    return canvas.toDataURL();
}

}

// --- Database Save & Exports ---
function saveCharacterToDB() {
    const firstName = document.getElementById('firstName').value || "Unknown";
    const lastName = document.getElementById('lastName').value || "Hero";
    const key = `${firstName}_${lastName}`.replace(/\s+/g, '_');
    const race = document.getElementById('raceSelect').value;
    const combatClass = document.getElementById('combatClassSelect').value;
    const statusText = document.getElementById('statusSheetPreview').innerText;
    const pixelArtImage = document.getElementById('emblemPreviewImg').src;
    const potential = document.getElementById('potentialText').innerText;

    const characterData = {
        key,
        firstName,
        lastName,
        race,
        potential,
        combatClass,
        statusText,
        pixelArtImage,
        timestamp: Date.now()
    };

    const request = indexedDB.open("characterDatabase", 3);
    request.onsuccess = function(event) {
        const db = event.target.result;
        const transaction = db.transaction(["characters"], "readwrite");
        const objectStore = transaction.objectStore("characters");

        objectStore.put(characterData);

        transaction.oncomplete = function() {
            alert(`Character '${firstName} ${lastName}' successfully saved to Database!`);
        };
    };
    request.onerror = function(event) {
        console.error("IndexedDB error:", event.target.error);
    };
}

        leftEye: document.getElementById('leftEye').value,
        rightEye: document.getElementById('rightEye').value,
        hairColor: document.getElementById('hairColor').value,
        hairStyle: document.getElementById('hairStyle').value,
        heightFeet: document.getElementById('heightFeet').value,
        heightInches: document.getElementById('heightInches').value,
        weightKg: document.getElementById('weightKg').value,
        bodyBuild: document.getElementById('bodyBuildSelect').value,
        combatClass: document.getElementById('combatClassSelect').value,
        combatStyle: document.getElementById('combatStyleSelect').value,
        technique: document.getElementById('techniqueSelect').value,
        mainHand: document.getElementById('mainHandInput').value,
        offHand: document.getElementById('offHandInput').value,
        place: document.getElementById('placeInput').value,
        weather: document.getElementById('weatherSelect').value,
        emblemSeed: emblemSeed
    };

    const blob = new Blob([JSON.stringify(characterData, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${fname}_${lname}_CustomCharacter.json`;
    a.click();
    URL.revokeObjectURL(url);
}

function triggerImportJSON() {
    document.getElementById('jsonFileInput').click();
}

function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            document.getElementById('firstName').value = data.firstName || "Hero";
            document.getElementById('lastName').value = data.lastName || "";
            document.getElementById('raceSelect').value = data.race || "Human";
            onRaceChange();
            if (data.raceTrait) document.getElementById('raceTraitsSelect').value = data.raceTrait;

            document.getElementById('strInput').value = data.str || 10;
            document.getElementById('conInput').value = data.con || 10;
            document.getElementById('dexInput').value = data.dex || 10;
            document.getElementById('intInput').value = data.int || 10;
            document.getElementById('resInput').value = data.res || 10;
            document.getElementById('perInput').value = data.per || 10;

            document.getElementById('bloodType').value = data.bloodType || "A";
            document.getElementById('skinColor').value = data.skinColor || "Fair";
            document.getElementById('leftEye').value = data.leftEye || "Brown";
            document.getElementById('rightEye').value = data.rightEye || "Brown";
            document.getElementById('hairColor').value = data.hairColor || "Black";
            document.getElementById('hairStyle').value = data.hairStyle || "Short";

            document.getElementById('heightFeet').value = data.heightFeet || 5;
            document.getElementById('heightInches').value = data.heightInches || 10;
            document.getElementById('weightKg').value = data.weightKg || 70;
            calculateBMI();
            if (data.bodyBuild) document.getElementById('bodyBuildSelect').value = data.bodyBuild;

            document.getElementById('combatClassSelect').value = data.combatClass || "Juggernaut";
            onClassChange();
            if (data.combatStyle) document.getElementById('combatStyleSelect').value = data.combatStyle;
            if (data.technique) document.getElementById('techniqueSelect').value = data.technique;

            document.getElementById('mainHandInput').value = data.mainHand || "Fists";
            document.getElementById('offHandInput').value = data.offHand || "Fists";
            document.getElementById('placeInput').value = data.place || "Evac shelter";
            if (data.weather) document.getElementById('weatherSelect').value = data.weather;

            if (data.emblemSeed) emblemSeed = data.emblemSeed;

            onStatChange();
            alert("Character imported successfully!");
        } catch (err) {
            alert("Failed to parse JSON file.");
        }
    };
    reader.readAsText(file);
}
</script>
